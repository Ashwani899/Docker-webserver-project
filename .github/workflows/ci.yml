name: Docker web server checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Nginx image
        run: docker compose build
      - name: Start service
        run: docker compose up -d
      - name: Verify health endpoint and homepage
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health.html >/dev/null; then
              break
            fi
            sleep 2
          done
          test "$(curl --fail --silent http://127.0.0.1:8080/health.html)" = "ok"
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "Small image"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop service
        if: always()
        run: docker compose down --remove-orphans
